name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: app/Dockerfile

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    name: Build, Scan, SBOM and Sign
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # required for Cosign keyless signing
      packages: write       # required for GHCR push
      security-events: write # required for SARIF upload
      actions: read         # required by codeql-action/upload-sarif for run metadata

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set lower case image ref
        run: |
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/secure-app:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      # 1) BUILD locally first (do not push yet -- we want to scan before publishing)
      - name: Build Docker image (local)
        run: |
          docker build -t "${IMAGE_REF}" ./app

      # 2) SCAN: JSON report for artifacting + policy gate later.
      - name: Run Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'           # never fail here -- always upload the report
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-results
          path: trivy-results.json

      - name: Run Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json

      # 3) ENFORCE policy. If this fails, we stop -- nothing gets pushed/signed.
      - name: Enforce CRITICAL/HIGH gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 4) Only PUSH after the scan passed
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push "${IMAGE_REF}"

      # 5) SIGN the pushed image (keyless via Sigstore + GitHub OIDC)
      # Pin Cosign to v2.2.4 so signatures and attestations land at legacy
      # `<digest>.sig` / `<digest>.att` tags. Cosign v2.4+ defaults to the
      # Sigstore bundle v0.3 format attached as OCI 1.1 referrers, which
      # Kyverno <= v1.18 verifyImages keyless cannot consume yet.
      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v2.2.4'

      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes "${IMAGE_REF}"

      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes --predicate sbom.json --type cyclonedx "${IMAGE_REF}"

  # Phase 5 — Runtime enforcement.
  # Spin up a kind cluster, install Kyverno, apply the verifyImages
  # ClusterPolicy, then prove end-to-end that:
  #   * a pod referencing the just-signed image is ADMITTED,
  #   * a pod referencing an unsigned image is REJECTED at admission.
  # This makes runtime enforcement self-proving on every push.
  runtime-enforcement-test:
    name: Runtime Enforcement (Kyverno on kind)
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute lower-case image ref
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/secure-app:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Wait for signed image to be queryable on GHCR
        run: |
          for i in {1..20}; do
            if curl -fsSL -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER,,}/secure-app/manifests/${GITHUB_SHA}" \
              -H "Authorization: Bearer $(echo -n '' | base64)" >/dev/null 2>&1 \
              || curl -fsSL "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER,,}/secure-app/manifests/${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "Image ${IMAGE_REF} is reachable."
              exit 0
            fi
            echo "Attempt $i: image not yet reachable, sleeping 5s..."
            sleep 5
          done
          echo "::warning::Image was not reachable; proceeding anyway."

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: secure-supply-chain
          config: scripts/kind-config.yaml

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno
          helm repo update
          helm install kyverno kyverno/kyverno \
            --namespace kyverno --create-namespace \
            --version 3.8.0 \
            --wait --timeout 5m
          kubectl -n kyverno rollout status deployment/kyverno-admission-controller --timeout=5m

      - name: Apply ClusterPolicy
        run: |
          kubectl apply -f k8s/namespace.yaml -f k8s/kyverno-policy.yaml
          kubectl wait --for=condition=Ready clusterpolicy/verify-secure-app-images --timeout=2m
          kubectl get clusterpolicy

      - name: Deploy SIGNED pod (expect ADMITTED)
        run: |
          set -euo pipefail
          sed "s/__IMAGE_TAG__/${IMAGE_TAG}/g" k8s/demos/pass-signed.yaml | kubectl apply -f -
          kubectl -n demo-secure wait --for=condition=Ready pod/secure-app-signed --timeout=3m
          echo "Pod admitted and Ready."
          kubectl -n demo-secure get pod secure-app-signed -o wide

      - name: Show Kyverno verification annotation (cryptographic proof)
        run: |
          set -euo pipefail
          IMAGE=$(kubectl -n demo-secure get pod secure-app-signed -o jsonpath='{.spec.containers[0].image}')
          ANNOT=$(kubectl -n demo-secure get pod secure-app-signed -o jsonpath='{.metadata.annotations.kyverno\.io/verify-images}')
          echo "Pod image after admission (Kyverno mutated tag to digest):"
          echo "  $IMAGE"
          echo
          echo "Kyverno verifyImages annotation:"
          echo "$ANNOT" | python3 -m json.tool

      - name: Deploy UNSIGNED pod (expect REJECTED)
        run: |
          set +e
          OUT=$(kubectl apply -f k8s/demos/fail-unsigned.yaml 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ $RC -ne 0 ] && echo "$OUT" | grep -q "denied the request"; then
            echo "::notice::Unsigned image was rejected at admission, as expected."
            exit 0
          fi
          echo "::error::Unsigned image was NOT rejected. Admission control is broken."
          exit 1

      - name: Cluster events on failure
        if: failure()
        run: |
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=100 || true
