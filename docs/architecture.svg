<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Secure Supply Chain</title>
      <desc id="architecture-desc">Architecture diagram showing a secure pipeline from Git Commit through linting, CVE scanning, CycloneDX SBOM generation and Cosign keyless signing, ending at a Kyverno admission controller.</desc>
        <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: CI/CD Pipeline -->
        <rect x="216" y="176" width="576" height="152" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="224" y="180" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="264" y="189" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CI/CD PIPELINE</text>

        <!-- Arrows -->
        <line x1="168" y1="272" x2="240" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="368" y1="272" x2="440" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="568" y1="272" x2="640" y2="272" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="768" y1="272" x2="840" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Arrow labels -->
        <!-- Code -> Linting -->
        <rect x="180" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUSH</text>

        <!-- Linting -> Trivy -->
        <rect x="380" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASS</text>

        <!-- Trivy -> SBOM/Cosign -->
        <rect x="580" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="262" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASS</text>

        <!-- SBOM/Cosign -> Kyverno -->
        <rect x="768" y="252" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="798" y="262" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGNED</text>

        <!-- Node: Git Commit -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VCS</text>
        <text x="104" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git Commit</text>
        <text x="104" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Source Code</text>

        <!-- Node: Linting -->
        <rect x="240" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="240" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="248" y="248" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="260" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
        <text x="304" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Static Analysis</text>
        <text x="304" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Hadolint / Gitleaks</text>

        <!-- Node: Trivy Scan -->
        <rect x="440" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="240" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="448" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="462" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
        <text x="504" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CVE Scanner</text>
        <text x="504" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Trivy</text>

        <!-- Node: SBOM & Cosign (Focal) -->
        <rect x="640" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="240" width="128" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="648" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="662" y="257" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIG</text>
        <text x="704" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Attestation</text>
        <text x="704" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CycloneDX · Cosign</text>

        <!-- Node: Kyverno -->
        <rect x="840" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="840" y="240" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="848" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="862" y="257" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
        <text x="904" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kyverno</text>
        <text x="904" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Admission Control</text>

        <!-- Legend strip -->
        <line x1="40" y1="384" x2="968" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="416" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal Security Control</text>

        <rect x="190" y="416" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="210" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pipeline Stage</text>

        <rect x="310" y="416" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="330" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cluster Destination</text>

        <rect x="450" y="416" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="470" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Source Event</text>

        <line x1="560" y1="422" x2="588" y2="422" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="596" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal Verification</text>
        
        <line x1="700" y1="422" x2="728" y2="422" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="736" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pipeline Progression</text>
      </svg>